spring.application.name=kakeibo
server.port=8080

# DB接続（SQLite：ファイル形式。起動したフォルダ直下に kakeibo.db が作られます）
spring.datasource.url=jdbc:sqlite:kakeibo.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# テーブルは db/schema_sqlite.sql で作るのが基本。念のためJPAの自動作成も有効にしておく
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

logging.level.com.example.kakeibo=INFO
